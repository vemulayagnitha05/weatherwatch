<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeatherWatch</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>🌦️ WeatherWatch</h1>
      <p>Weather and air-quality monitoring powered by FastAPI, PostgreSQL and Kubernetes.</p>
    </header>

    <section class="controls">
      <label for="city">City</label>
      <select id="city"></select>
      <button id="refresh">Refresh</button>
    </section>

    <section id="status" class="status">Loading...</section>

    <section class="grid">
      <article><span>🌡️ Temperature</span><strong id="temperature">—</strong></article>
      <article><span>💧 Humidity</span><strong id="humidity">—</strong></article>
      <article><span>💨 Wind</span><strong id="wind">—</strong></article>
      <article><span>🌫️ PM2.5</span><strong id="pm25">—</strong></article>
      <article><span>🌫️ PM10</span><strong id="pm10">—</strong></article>
      <article><span>🟢 European AQI</span><strong id="aqi">—</strong></article>
    </section>

    <section class="history">
      <h2>Historical readings</h2>
      <p id="updated">—</p>
      <table>
        <thead>
          <tr>
            <th>Time</th><th>Temp °C</th><th>Humidity %</th><th>PM2.5</th><th>AQI</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </section>

    <footer>
      <a href="/docs" target="_blank">Open REST API documentation</a>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
